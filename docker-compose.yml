services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fmi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fmi_dev_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-fmi}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - fmi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fmi} -d ${POSTGRES_DB:-fmi}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Valkey (BSD-3) — Redis-protocol compatible; not Redis SSPL/RSAL.
  # API still uses REDIS_URL / RATE_LIMIT_BACKEND=redis (RESP client).
  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Survive transient process exits; intentional `compose stop` still stays down.
    restart: unless-stopped
    # Pin non-root even if the image was built before Dockerfile USER (stale cache).
    # Default matches image appuser (uid/gid 1000). On Linux bind-mount write issues,
    # set API_UID/API_GID to the host owner of ./backend and ./data (e.g. id -u / id -g).
    # Bind mounts hide image /app ownership; they do not change process UID.
    user: "${API_UID:-1000}:${API_GID:-1000}"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fmi}:${POSTGRES_PASSWORD:-fmi_dev_password_change_me}@db:5432/${POSTGRES_DB:-fmi}
      REDIS_URL: redis://valkey:6379/0
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      # Readiness (/readyz == /healthz): 503 when Postgres (or required Valkey via REDIS_URL) is down
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8000/readyz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    volumes:
      - ./backend:/app
      - ./data:/data
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    # Survive transient process exits; intentional `compose stop` still stays down.
    restart: unless-stopped
    environment:
      # Browser → host-mapped API; SSR inside the container → Docker network
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://api:8000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  fmi_pgdata:
