apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fmi.secretName" . }}
  labels:
    {{- include "fmi.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "fmi.databaseUrl" . | quote }}
  REDIS_URL: {{ include "fmi.redisUrl" . | quote }}
  {{- if or .Values.secrets.postgresPassword .Values.postgres.auth.password }}
  postgres-password: {{ .Values.secrets.postgresPassword | default .Values.postgres.auth.password | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | default .Values.postgres.auth.password | quote }}
  {{- end }}
  {{- if .Values.secrets.apiKey }}
  API_KEY: {{ .Values.secrets.apiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.opsApiToken }}
  OPS_API_TOKEN: {{ .Values.secrets.opsApiToken | quote }}
  {{- end }}
  {{- if .Values.secrets.credentialsMasterKey }}
  CREDENTIALS_MASTER_KEY: {{ .Values.secrets.credentialsMasterKey | quote }}
  {{- end }}
  {{- range $k, $v := .Values.secrets.extra }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
